spring.application.name=auction-server
server.port=8080

spring.datasource.url=jdbc:sqlite:data/auction.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

spring.sql.init.mode=embedded

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=auction-system-super-secret-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

spring.task.scheduling.pool.size=5

logging.level.com.auction=DEBUG
logging.level.org.springframework.security=WARN